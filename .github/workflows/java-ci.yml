name: Java Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'java/**'
      - '.github/workflows/java-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'java/**'
      - '.github/workflows/java-ci.yml'

jobs:
  java-tests:
    name: Java Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: java/LeetCodeProblems/pom.xml

      - name: Run Java tests
        run: |
          chmod +x ./mvnw
          ./mvnw test
        working-directory: ./java/LeetCodeProblems
